repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: pipenv run ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: pipenv run mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: pipenv run pytest -q
        language: system
        pass_filenames: false
        always_run: true