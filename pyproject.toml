[project]
name = "calcifer"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
	"PyYAML",
]

[dependency-groups]
dev = [
	"mypy",
	"pre-commit",
	"pytest",
	"pytest-cov",
	"pytest-snapshot",
	"ruff",
	"types-PyYAML",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
# Enable flake8-bugbear (`B`) rules.
select = ["E", "F", "B"]

# Never enforce `E501` (line length violations).
ignore = ["E501"]

# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[tool.mypy]
python_version = "3.15"
files = ["calcifer", "engine", "pattern", "ui", "world"]
show_error_codes = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]